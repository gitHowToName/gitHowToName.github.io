<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gitHowToName · 个人主页</title>
  <meta name="description" content="gitHowToName 的个人主页，欢迎交流。" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>

  <main class="container">
    <!-- 头部 -->
    <header class="hero">
      <div class="avatar-wrap">
        <img class="avatar" src="https://avatars.githubusercontent.com/u/95419764?v=4" alt="头像" />
      </div>
      <h1 class="name">gitHowToName</h1>
      <p class="title">开发者 · 终身学习者</p>
      <p class="intro">
        你好，欢迎来到我的个人主页！我热爱编程与技术探索，在这里分享我的项目与想法。
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="https://github.com/gitHowToName" target="_blank" rel="noopener">GitHub</a>
        <a class="btn btn-ghost" href="#projects">查看项目</a>
      </div>
    </header>

    <!-- 技能 -->
    <section class="card">
      <h2>技能</h2>
      <div class="tags">
        <span class="tag">HTML / CSS</span>
        <span class="tag">JavaScript</span>
        <span class="tag">Python</span>
        <span class="tag">Git / GitHub</span>
        <span class="tag">Web 开发</span>
      </div>
    </section>

    <!-- 项目 -->
    <section id="projects" class="card">
      <h2>项目</h2>
      <p class="muted">
        我目前在 GitHub 上有 <strong>8</strong> 个公开仓库，正在持续更新中。点击下方按钮直达我的仓库列表。
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="https://github.com/gitHowToName?tab=repositories" target="_blank" rel="noopener">浏览我的仓库</a>
      </div>
    </section>

    <!-- 关于 -->
    <section class="card">
      <h2>关于本站</h2>
      <p class="muted">
        本站使用 <strong>GitHub Pages</strong> 免费托管，完全开源，欢迎 fork 参考。
      </p>
      <a class="link" href="https://github.com/gitHowToName/gitHowToName.github.io" target="_blank" rel="noopener">查看本站源码 →</a>
    </section>

    <footer class="footer">
      <p>© <span id="year"></span> gitHowToName · 由 GitHub Pages 驱动</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
